name: Regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check reviewed Arabic and Latin corpus
        run: python3 scripts/validate_dzikir_corpus.py
      - name: Unit tests, Android lint and APK
        run: bash gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest :shared:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain
